services:
  - type: web
    name: veritas-core-demo
    runtime: docker
    branch: feature/render-demo
    plan: free
    healthCheckPath: /up
    autoDeployTrigger: off
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_SKIP_ACCOUNTING_TRIGGERS
        value: "true"
      - key: DEMO_RUN_MIGRATIONS
        value: "false"
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: MAIL_MAILER
        value: log
      - key: TRUSTED_PROXIES
        value: "*"
